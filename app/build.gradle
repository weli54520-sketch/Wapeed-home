plugins {
    id 'com.android.application' version '8.5.2'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

// رقم الإصدار = رقم البناء في GitHub (عشان التحديث من داخل الواجهة يعرف الجديد)
def buildNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// مفتاح توقيع ثابت: بدونه كل بناء يطلع بتوقيع مختلف وما يقبل التحديث فوق القديم
def ksFile = file("wm-key.jks")
ksFile.bytes = "".decodeBase64()

android {
    namespace 'com.riyadh.home'
    compileSdk 34
    defaultConfig {
        applicationId 'com.riyadh.home'
        minSdk 26
        targetSdk 34
        versionCode buildNo
        versionName "1." + buildNo
    }
    signingConfigs {
        wm {
            storeFile ksFile
            storePassword 'wmlauncher'
            keyAlias 'wm'
            keyPassword 'wmlauncher'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.wm }
        release { signingConfig signingConfigs.wm }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}
