plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// رقم الإصدار = رقم البناء في GitHub
def buildNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.wm.iptv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wm.iptv'
        minSdk 26
        targetSdk 35
        versionCode buildNo
        versionName "1." + buildNo
    }

    // مفتاح التوقيع يجي من GitHub Secrets (ما ينحفظ في المستودع).
    // مفتاح ثابت = كل تحديث ينزل فوق القديم بدون حذف.
    def ksPath = System.getenv("WMTV_KEYSTORE")
    signingConfigs {
        wmtv {
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("WMTV_KEYSTORE_PASSWORD")
                keyAlias System.getenv("WMTV_KEY_ALIAS")
                keyPassword System.getenv("WMTV_KEY_PASSWORD")
            } else {
                // بناء محلي بدون مفتاح: نستخدم مفتاح التطوير
                def dbg = file("${System.getProperty('user.home')}/.android/debug.keystore")
                storeFile dbg
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    // نسختين من نفس المشروع: التلفزيون والجوال
    flavorDimensions 'device'
    productFlavors {
        tv {
            dimension 'device'
            applicationId 'com.wm.iptv'
        }
        mobile {
            dimension 'device'
            applicationId 'com.wm.iptv.mobile'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.wmtv
        }
        debug {
            signingConfig signingConfigs.wmtv
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true; buildConfig true }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    def media3 = '1.5.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // فك ترميز الصوت (AC3 / EAC3 / DTS ...) للأجهزة اللي ما تدعمه
    implementation 'org.jellyfin.media3:media3-ffmpeg-decoder:1.5.0+1'

    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
